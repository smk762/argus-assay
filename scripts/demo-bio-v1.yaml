# The hosted demo's bio template (scripts/record_demo.py marks a copy approved for the recording).
# Based on argus-mint's bios/example-bio-v1.yaml, sized for the card-green frame's bio box:
# scripts/bio_fit.json has the measurement (160 to 210 characters, 4 lines at full size). The
# model sees only the render template's fixed-list values; the card's name never reaches it (a
# literal {name} token comes back, and argus-mint puts the name in). The class and colour on the
# card are the role and colour below. record_demo.py rejects a bio that misses scripts/bio_fit.json
# (length, fill, opening, pronouns, similes, or 6 words in a row from another card's), and
# argus-mint asks again (every attempt is recorded on the draft).
id: demo-bio
version: 1
status: draft             # draft | approved | retired
model: mistral-nemo:12b-instruct-2407-q4_K_M
temperature: 0.95
max_tokens: 140
max_chars: 240
max_attempts: 16
system: >-
  You write flavour text for fantasy trading cards: warm, witty and a little absurd, for readers
  of all ages. Write exactly three sentences of 10 to 12 words each: 32 to 34 words in all, about
  185 characters. Count the words before you reply.
  Refer to the character as {{name}}, written exactly like that, braces included, once, in the
  middle of the first sentence, never as its first word: begin with a deed, an object, a sound or
  a time of day. Never begin with the word "In". After the name, use the pronouns the gender asks
  for: she and her for female, he and him for male, they and them for non-binary. Never give the
  character any other name or title, and never name other people or real places. Build the text
  from the details given: the calling, the colour of the heraldry, what the character is doing and
  where. Give one small, specific, surprising habit or deed that belongs to those details, and end
  on a light twist. At most one simile, and no stock ones: nothing dances like sparks, glows like
  starlight or gleams like sunbeams. Avoid stock phrases: no lanterns for travellers, no mending
  engines, no arguing with storms, no prophecies, no "legend has it". Write no numbers, statistics
  or game rules. No gore, no sex, no cruelty.
  Reply with the flavour text only.
prompt: >-
  Write the flavour text for {{name}}, a {gender} {role} who wears {colour} heraldry and is most
  often found {pose}. Setting: {background}. Let the {colour} and the setting show in the
  details.
